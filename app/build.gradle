plugins { id 'com.android.application' }

// 署名鍵はリポジトリの外に置く。keystore.properties（gitignore 済み）で渡す。
def signing = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace 'com.theta.homehatch'
    compileSdk 36
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.theta.homehatch'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1-alpha'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        if (signing.getProperty('storeFile')) {
            release {
                storeFile file(signing.getProperty('storeFile'))
                storePassword signing.getProperty('storePassword')
                keyAlias signing.getProperty('keyAlias')
                keyPassword signing.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            if (signing.getProperty('storeFile')) signingConfig signingConfigs.release
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    // 画面の見本（スクリーンショット）を JVM 上で描く。アプリ本体には入らない。
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
