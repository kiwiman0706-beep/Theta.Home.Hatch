plugins { id 'com.android.application' }

android {
    namespace 'com.theta.homehatch'
    compileSdk 36
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.theta.homehatch'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-alpha'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    if (project.hasProperty('hatchDebugKeystore')) {
        signingConfigs {
            alpha {
                storeFile file(project.property('hatchDebugKeystore'))
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes { debug { minifyEnabled false }; release { minifyEnabled false } }
    if (project.hasProperty('hatchDebugKeystore')) {
        buildTypes.debug.signingConfig signingConfigs.alpha
    }
}

tasks.withType(JavaCompile).configureEach { options.fork = true }
