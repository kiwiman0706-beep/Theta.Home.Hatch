pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
    resolutionStrategy { eachPlugin { if (requested.id.id == 'com.android.application') useModule('com.android.tools.build:gradle:' + (requested.version ?: '8.13.0')) } }
}
dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
rootProject.name = 'ThetaHomeHatch'
include ':app'
